<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>getCityInfo</title>
      <link rel="stylesheet" href="https://a.amap.com/jsapi_demos/static/demo-center/css/demo-center.css" />
    <style>
        html,body,#container{
            height:100%;
        }
        .info{
            width:26rem;
        }
    </style>
<body>
<div id='container'></div>
<div class="info">
    <h4 id='status'></h4><hr>
    <p id='result'></p><hr>
    <p >由于众多浏览器已不再支持非安全域的定位请求，为保位成功率和精度，请升级您的站点到HTTPS。</p>
</div>
<script type="text/javascript">
    window._AMapSecurityConfig = {
        securityJsCode: '89a1f2991c73783e7ee7e123638b3f96',
    }
</script>
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=f22a57601541179dc38e16f7d62d4b22&plugin=AMap.Geolocation,AMap.CitySearch"></script>
<script type="text/javascript">
    var map = new AMap.Map('container', {
        resizeEnable: true
    });
    AMap.plugin('AMap.Geolocation', function() {
        var geolocation = new AMap.Geolocation({
            enableHighAccuracy: true,//是否使用高精度定位，默认:true
            timeout: 3000,          //超过3秒后停止定位，默认：5s
            buttonPosition:'RB',    //定位按钮的停靠位置
            buttonOffset: new AMap.Pixel(10, 20),//定位按钮与设置的停靠位置的偏移量，默认：Pixel(10, 20)
            zoomToAccuracy: true,   //定位成功后是否自动调整地图视野到定位点
        });
        map.addControl(geolocation);
        geolocation.getCityInfo(function (status, result) {
            if (status == 'complete') {
                _position = {
                    lng: result.position[0], // 经度
                    lat: result.position[1] // 纬度
                };
                if (result && result.city) {
                    _city = result.city;
                }
                if (result && result.province) {
                    _province = result.province;
                }
                alert("geolocation.getCityInfo: " + JSON.stringify(_position));
            } else {
                // 城市查询，IP定位获取当前城市信息
                AMap.plugin('AMap.CitySearch', function () {
                    var citySearch = new AMap.CitySearch();
                    // 城市查询，IP定位获取当前城市信息
                    citySearch.getLocalCity(function (status, result) {
                        if (status === 'complete' && result.info === 'OK') {
                            // 查询成功，result即为当前所在城市信息
                            var northEast = '';
                            var southWest = '';
                            if (result.rectangle) {
                                var arr = result.rectangle.split(";");
                                if (arr && arr.length >= 2) {
                                    southWest = arr[0].split(",");
                                    northEast = arr[1].split(",");
                                }
                            }
                            if (northEast && southWest) {
                                var mybounds = new AMap.Bounds(southWest, northEast);
                                // 由于此方法不返回具体位置信息，获取边界范围中心点位置
                                var centerPosition = mybounds.getCenter();
                                _position = {
                                    lng: centerPosition.lng, // 经度
                                    lat: centerPosition.lat // 纬度
                                };
                                if (result.city) {
                                    _city = result.city
                                }
                                if (result.province) {
                                    _province = result.province
                                }
                                if (typeof sucCb == 'function') {
                                    alert("citySearch.getLocalCity: " + JSON.stringify(_position));
                                }
                            }
                        } else {
                            if (typeof failCb == 'function') {
                                alert("citySearch.getLocalCity: faild");
                            }
                        }
                    })
                })
            }
        });
    });
</script>
</body>
</html>
